<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mc-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1c"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="rose-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#mc-dark-grad)"/>

  <!-- macOS Window Title Bar -->
  <rect width="800" height="38" rx="16" fill="#0f172a"/>
  <rect y="26" width="800" height="12" fill="#0f172a"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#10b981"/>
  
  <text x="400" y="24" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    MotherCare Platform &bull; Multilingual Maternity RAG AI (Google Gemini) &bull; Emergency Red-Flag Triage
  </text>
  
  <rect x="670" y="10" width="112" height="20" rx="10" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1"/>
  <circle cx="682" cy="20" r="3.5" fill="#f43f5e"/>
  <text x="730" y="24" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="9" font-weight="700">CLINICAL RAG</text>

  <!-- TOP TOOLBAR: MULTILINGUAL & STAGE-SPECIFIC CONTEXT -->
  <rect x="18" y="48" width="764" height="32" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.08)"/>
  <text x="32" y="69" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="700">STAGE: 3RD TRIMESTER (WEEK 34)</text>
  <text x="260" y="69" fill="#94a3b8" font-family="monospace" font-size="11">&bull; Multilingual Support: English | हिंदी | తెలుగు</text>
  <rect x="625" y="54" width="145" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="697" y="68" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">RED-FLAG ACTIVE</text>

  <!-- LEFT PANEL: STAGE CONTEXT & VITAL TELEMETRY -->
  <rect x="18" y="90" width="200" height="342" rx="10" fill="#0b1122" stroke="rgba(255,255,255,0.08)"/>
  <rect x="18" y="90" width="200" height="32" rx="10" fill="#131d36"/>
  <text x="118" y="111" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700">STAGE CONTEXT</text>

  <g transform="translate(28, 134)">
    <text x="0" y="0" fill="#f43f5e" font-family="monospace" font-size="9" font-weight="700">Target Stage:</text>
    <rect x="0" y="8" width="180" height="28" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="1"/>
    <text x="12" y="26" fill="#fda4af" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">Late Pregnancy / Week 34</text>

    <!-- Language Selector Buttons -->
    <text x="0" y="56" fill="#94a3b8" font-family="monospace" font-size="9">Active Dialect:</text>
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="55" height="24" rx="4" fill="#38bdf8"/>
      <text x="27" y="16" text-anchor="middle" fill="#050811" font-family="monospace" font-size="8.5" font-weight="700">English</text>

      <rect x="62" y="0" width="55" height="24" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="89" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8.5">हिंदी</text>

      <rect x="125" y="0" width="55" height="24" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="152" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8.5">తెలుగు</text>
    </g>

    <!-- Stage-specific nutritional context -->
    <text x="0" y="116" fill="#cbd5e1" font-family="monospace" font-size="9" font-weight="700">Stage Clinical Protocol:</text>
    <text x="0" y="132" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8.5">&bull; Iron &amp; Folate absorption</text>
    <text x="0" y="146" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8.5">&bull; Fetal movement baseline</text>
    <text x="0" y="160" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8.5">&bull; Pre-labor contraction triage</text>

    <!-- Semantic Search Vector Embedding match -->
    <rect x="0" y="180" width="180" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="200" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="8.5" font-weight="700">Vector Embeddings (RAG)</text>
    <text x="90" y="216" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="8">Cosine Similarity: 0.94</text>
  </g>

  <!-- CENTER PANEL: EVIDENCE-GROUNDED RAG CHAT & RED-FLAG TRIAGE -->
  <rect x="228" y="90" width="344" height="342" rx="10" fill="#070a16" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1.2"/>
  
  <!-- Red-Flag Detection Banner -->
  <rect x="240" y="102" width="320" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="254" cy="115" r="4" fill="#10b981"/>
  <text x="265" y="119" fill="#a7f3d0" font-family="monospace" font-size="8.5" font-weight="700">✓ RED-FLAG TRIAGE: No Critical Emergencies Detected</text>

  <!-- User Query Bubble -->
  <g transform="translate(260, 142)">
    <rect x="0" y="0" width="280" height="44" rx="8" fill="#1e293b"/>
    <text x="12" y="18" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600">"Experiencing mild swelling in feet during week 34."</text>
    <text x="12" y="32" fill="#94a3b8" font-family="monospace" font-size="8">Tri-3 Context Selection &bull; Dialect: English</text>
  </g>

  <!-- Google Gemini RAG Answer Bubble -->
  <g transform="translate(240, 198)">
    <rect x="0" y="0" width="320" height="152" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="320" height="24" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="12" y="16" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="700">Google Gemini Grounded RAG &bull; Confidence: 99.2%</text>

    <text x="12" y="40" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="8.5">Mild peripheral edema is common in late third trimester</text>
    <text x="12" y="54" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="8.5">due to venous compression from the growing uterus.</text>
    
    <text x="12" y="74" fill="#a7f3d0" font-family="'Space Grotesk', sans-serif" font-size="8.5">&bull; Recommendation: Elevate legs, avoid standing > 1 hr.</text>
    <text x="12" y="90" fill="#fca5a5" font-family="'Space Grotesk', sans-serif" font-size="8.5">&bull; Red-Flag Rule: If sudden facial swelling or severe</text>
    <text x="12" y="104" fill="#fca5a5" font-family="'Space Grotesk', sans-serif" font-size="8.5">headache develops, seek emergency hospital care immediately.</text>

    <!-- Source Provenance Citation Box -->
    <rect x="12" y="118" width="296" height="24" rx="4" fill="#1e293b"/>
    <circle cx="24" cy="130" r="3" fill="#10b981"/>
    <text x="32" y="134" fill="#94a3b8" font-family="monospace" font-size="7.5">Provenance: WHO Clinical Maternal Protocols (Section 4.2)</text>
  </g>

  <!-- Input Bar Simulation -->
  <rect x="240" y="364" width="320" height="34" rx="8" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
  <text x="254" y="385" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="8.5">Ask questions about pregnancy, newborn care, or postpartum...</text>

  <!-- RIGHT PANEL: ADMIN ANALYTICS DASHBOARD -->
  <rect x="582" y="90" width="200" height="342" rx="10" fill="#0b1122" stroke="rgba(255,255,255,0.08)"/>
  <rect x="582" y="90" width="200" height="32" rx="10" fill="#131d36"/>
  <text x="682" y="111" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700">ADMIN ANALYTICS</text>

  <!-- Consultation Analytics Graph -->
  <g transform="translate(594, 134)">
    <text x="0" y="0" fill="#f43f5e" font-family="monospace" font-size="9" font-weight="700">Consultation Volume</text>
    <line x1="0" y1="6" x2="175" y2="6" stroke="rgba(255,255,255,0.1)"/>

    <!-- Bar Chart for 4 categories -->
    <g transform="translate(0, 18)">
      <rect x="5" y="30" width="25" height="40" rx="3" fill="#f43f5e"/>
      <text x="17" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="7">Tri-1</text>

      <rect x="45" y="15" width="25" height="55" rx="3" fill="#ec4899"/>
      <text x="57" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="7">Tri-2</text>

      <rect x="85" y="0" width="25" height="70" rx="3" fill="#38bdf8"/>
      <text x="97" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="7">Tri-3</text>

      <rect x="125" y="20" width="25" height="50" rx="3" fill="#10b981"/>
      <text x="137" y="80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="7">Post</text>
    </g>
  </g>

  <!-- Content-Gap Identification Panel -->
  <g transform="translate(594, 250)">
    <rect x="0" y="0" width="176" height="135" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(244, 63, 94, 0.3)"/>
    <text x="10" y="18" fill="#fda4af" font-family="monospace" font-size="9" font-weight="700">&bull; Content-Gap Detector:</text>
    
    <text x="10" y="38" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="8">Identified regional query gap</text>
    <text x="10" y="50" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="8">in Telugu postpartum</text>
    <text x="10" y="62" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="8">neonatal jaundice care.</text>

    <text x="10" y="86" fill="#38bdf8" font-family="monospace" font-size="8.5">&bull; Auto-Ingest: Clinical FAQ</text>
    
    <rect x="10" y="98" width="156" height="24" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="88" y="114" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="700">UPDATE RAG CORPUS</text>
  </g>
</svg>