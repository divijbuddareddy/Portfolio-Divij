<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nm-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1a"/>
      <stop offset="50%" stop-color="#0f162d"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="connectome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="gradcam-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradcam-heat2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#nm-dark-grad)"/>

  <!-- macOS Window Title Bar -->
  <rect width="800" height="38" rx="16" fill="#0f172a"/>
  <rect y="26" width="800" height="12" fill="#0f172a"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#10b981"/>
  
  <text x="400" y="24" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    NeuroMap AI &bull; MRI/dMRI Quantitative Morphometry &bull; Three.js 3D Connectome &amp; Gemini Report
  </text>
  
  <rect x="680" y="10" width="102" height="20" rx="10" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="731" y="24" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="700">Three.js WebGL</text>

  <!-- TOP TOOLBAR -->
  <rect x="18" y="48" width="764" height="32" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.08)"/>
  <text x="32" y="69" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="700">PATIENT ID: MRI-dMRI-8492</text>
  <text x="210" y="69" fill="#94a3b8" font-family="monospace" font-size="11">&bull; Modality: T1-Weighted MRI + High-Angular dMRI</text>
  <rect x="580" y="54" width="90" height="20" rx="4" fill="rgba(0, 240, 255, 0.15)"/>
  <text x="625" y="68" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="700">GRAD-CAM 3D</text>
  <rect x="680" y="54" width="92" height="20" rx="4" fill="rgba(236, 72, 153, 0.2)"/>
  <text x="726" y="68" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="9" font-weight="700">SHAP BENCH</text>

  <!-- LEFT PANEL: ML BENCHMARK & MORPHOMETRY -->
  <rect x="18" y="90" width="200" height="342" rx="10" fill="#0b1122" stroke="rgba(255,255,255,0.08)"/>
  <rect x="18" y="90" width="200" height="32" rx="10" fill="#131d36"/>
  <text x="118" y="111" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700">ML BENCHMARKING</text>

  <!-- Benchmark Models -->
  <g transform="translate(30, 134)">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="9">RandomForest Classifier</text>
    <text x="175" y="0" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="9">94.2%</text>
    <rect x="0" y="5" width="175" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="5" width="165" height="5" rx="2.5" fill="#38bdf8"/>

    <text x="0" y="24" fill="#94a3b8" font-family="monospace" font-size="9">XGBoost Ensemble</text>
    <text x="175" y="24" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="9">96.1%</text>
    <rect x="0" y="29" width="175" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="29" width="168" height="5" rx="2.5" fill="#818cf8"/>

    <text x="0" y="48" fill="#a7f3d0" font-family="monospace" font-size="9" font-weight="700">3D-CNN MorphoNet</text>
    <text x="175" y="48" text-anchor="end" fill="#10b981" font-family="monospace" font-size="9" font-weight="700">98.4%</text>
    <rect x="0" y="53" width="175" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="53" width="172" height="5" rx="2.5" fill="#10b981"/>
  </g>

  <!-- Quantitative Morphometry Metrics -->
  <g transform="translate(30, 220)">
    <text x="0" y="0" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700">BRAIN MORPHOMETRY</text>
    <line x1="0" y1="6" x2="175" y2="6" stroke="rgba(255,255,255,0.1)"/>

    <text x="0" y="24" fill="#94a3b8" font-family="monospace" font-size="9">Hippocampus L/R:</text>
    <text x="175" y="24" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="9">3.42 cm³</text>

    <text x="0" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Ventricular Vol:</text>
    <text x="175" y="42" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="9">18.2 cm³</text>

    <text x="0" y="60" fill="#94a3b8" font-family="monospace" font-size="9">Cortical Thickness:</text>
    <text x="175" y="60" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="9">2.64 mm</text>

    <text x="0" y="78" fill="#94a3b8" font-family="monospace" font-size="9">Fractional Anisotropy:</text>
    <text x="175" y="78" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="9">0.518 FA</text>
  </g>

  <!-- CENTER PANEL: 3D CONNECTOME & 3D GRAD-CAM HEATMAP -->
  <rect x="228" y="90" width="344" height="342" rx="10" fill="#070a16" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2"/>
  
  <!-- Interactive Viewport Badge -->
  <rect x="240" y="102" width="165" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 240, 255, 0.4)"/>
  <circle cx="252" cy="114" r="4" fill="#00f0ff"/>
  <text x="264" y="118" fill="#e2e8f0" font-family="monospace" font-size="9" font-weight="700">3D CONNECTOME MAP</text>

  <rect x="445" y="102" width="115" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(236, 72, 153, 0.4)"/>
  <text x="502" y="118" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="9" font-weight="700">3D GRAD-CAM</text>

  <!-- 3D Coordinate Grid Lines -->
  <circle cx="400" cy="260" r="120" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="8 6"/>
  <circle cx="400" cy="260" r="80" fill="none" stroke="rgba(255, 255, 255, 0.05)"/>

  <!-- Brain Contour Geometry -->
  <path d="M 400 150 C 330 145, 275 190, 275 250 C 275 295, 305 325, 335 345 C 365 365, 385 365, 400 375 C 415 365, 435 365, 465 345 C 495 325, 525 295, 525 250 C 525 190, 470 145, 400 150 Z" 
        fill="rgba(15, 23, 42, 0.6)" stroke="url(#connectome-grad)" stroke-width="2.5" filter="url(#bloom)"/>

  <!-- Central Fissure -->
  <path d="M 400 155 Q 395 260 400 370" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- 3D Grad-CAM Activation Heatmaps (Hot Pink & Cyan Focus) -->
  <circle cx="340" cy="270" r="38" fill="url(#gradcam-heat)" filter="url(#bloom)"/>
  <circle cx="450" cy="240" r="32" fill="url(#gradcam-heat2)" filter="url(#bloom)"/>

  <!-- Synaptic Connectome Pathways -->
  <g stroke="#00f0ff" stroke-width="1.3" opacity="0.85">
    <!-- Left Tracts -->
    <line x1="315" y1="215" x2="355" y2="195"/>
    <line x1="355" y1="195" x2="400" y2="210"/>
    <line x1="315" y1="215" x2="310" y2="265"/>
    <line x1="310" y1="265" x2="340" y2="275"/>
    <line x1="340" y1="275" x2="380" y2="245"/>
    <line x1="380" y1="245" x2="400" y2="210"/>
    <line x1="340" y1="275" x2="350" y2="330"/>
    
    <!-- Right Tracts -->
    <line x1="485" y1="215" x2="445" y2="195"/>
    <line x1="445" y1="195" x2="400" y2="210"/>
    <line x1="485" y1="215" x2="490" y2="265"/>
    <line x1="490" y1="265" x2="455" y2="275"/>
    <line x1="455" y1="275" x2="420" y2="245"/>
    <line x1="420" y1="245" x2="400" y2="210"/>
    <line x1="455" y1="275" x2="450" y2="330"/>
  </g>

  <!-- Connectome Node Vertices -->
  <circle cx="315" cy="215" r="4.5" fill="#00f0ff"/>
  <circle cx="355" cy="195" r="3.5" fill="#38bdf8"/>
  <circle cx="400" cy="210" r="5" fill="#f43f5e" filter="url(#bloom)"/>
  <circle cx="310" cy="265" r="4" fill="#8b5cf6"/>
  <circle cx="340" cy="275" r="6" fill="#ec4899" filter="url(#bloom)"/>
  <circle cx="380" cy="245" r="4" fill="#00f0ff"/>
  <circle cx="350" cy="330" r="3.5" fill="#38bdf8"/>

  <circle cx="485" cy="215" r="4.5" fill="#00f0ff"/>
  <circle cx="445" cy="195" r="3.5" fill="#38bdf8"/>
  <circle cx="490" cy="265" r="4" fill="#8b5cf6"/>
  <circle cx="455" cy="275" r="5.5" fill="#38bdf8"/>
  <circle cx="420" cy="245" r="4" fill="#00f0ff"/>
  <circle cx="450" cy="330" r="3.5" fill="#38bdf8"/>

  <!-- Three.js Orbit Controls overlay -->
  <rect x="330" y="394" width="140" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.2)"/>
  <text x="400" y="410" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">WebGL Orbit: Active</text>

  <!-- RIGHT PANEL: SHAP ATTRIBUTION & GEMINI REPORT -->
  <rect x="582" y="90" width="200" height="342" rx="10" fill="#0b1122" stroke="rgba(255,255,255,0.08)"/>
  <rect x="582" y="90" width="200" height="32" rx="10" fill="#131d36"/>
  <text x="682" y="111" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="700">SHAP &amp; GEMINI REPORT</text>

  <!-- SHAP Feature Importance Bars -->
  <g transform="translate(594, 134)">
    <text x="0" y="0" fill="#f472b6" font-family="monospace" font-size="9" font-weight="700">SHAP Feature Attribution</text>
    
    <text x="0" y="20" fill="#cbd5e1" font-family="monospace" font-size="8">L-Hippocampal Vol</text>
    <rect x="0" y="24" width="175" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="24" width="142" height="6" rx="3" fill="#f43f5e"/>

    <text x="0" y="42" fill="#cbd5e1" font-family="monospace" font-size="8">Temporal Cortical Thick</text>
    <rect x="0" y="46" width="175" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="46" width="118" height="6" rx="3" fill="#ec4899"/>

    <text x="0" y="64" fill="#cbd5e1" font-family="monospace" font-size="8">dMRI Axial Diffusivity</text>
    <rect x="0" y="68" width="175" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="68" width="88" height="6" rx="3" fill="#8b5cf6"/>
  </g>

  <!-- Gemini-Powered Research Synthesis Report -->
  <g transform="translate(594, 230)">
    <rect x="0" y="0" width="176" height="186" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(139, 92, 246, 0.3)"/>
    <rect x="0" y="0" width="176" height="26" rx="8" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="88" y="17" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="700">Google Gemini Synthesis</text>

    <text x="10" y="44" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600">&bull; Quantitative Summary:</text>
    <text x="10" y="58" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">3D-CNN and Grad-CAM</text>
    <text x="10" y="70" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">isolate parietal-temporal</text>
    <text x="10" y="82" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">connectome deviation.</text>

    <text x="10" y="104" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600">&bull; Confidence Index: 97.8%</text>
    
    <text x="10" y="124" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600">&bull; Research Insight:</text>
    <text x="10" y="138" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">High tractography</text>
    <text x="10" y="150" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">preservation in frontal lobe.</text>

    <rect x="10" y="162" width="156" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="88" y="174" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7.5" font-weight="700">✓ CLINICAL REPORT GENERATED</text>
  </g>
</svg>