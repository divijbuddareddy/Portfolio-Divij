<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="30" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="140" r="100" fill="#00f0ff" opacity="0.25" filter="url(#ambient)" />
  <circle cx="360" cy="360" r="120" fill="#8b5cf6" opacity="0.3" filter="url(#ambient)" />

  <!-- Cyber Grid Background lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Tech Target Rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="250" cy="230" r="140" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" stroke-dasharray="14 10"/>

  <!-- Glowing Silhouette Base -->
  <!-- Shoulders & Torso -->
  <path d="M 120 440 C 130 350, 180 320, 250 320 C 320 320, 370 350, 380 440 Z" fill="url(#neon-cyan)" opacity="0.85" filter="url(#glow)"/>
  <path d="M 135 440 C 145 360, 190 332, 250 332 C 310 332, 355 360, 365 440 Z" fill="#0d1527"/>

  <!-- Neck -->
  <rect x="230" y="250" width="40" height="70" rx="8" fill="#1e293b"/>

  <!-- Head / Face Silhouette -->
  <ellipse cx="250" cy="200" rx="65" ry="80" fill="#0f172a" stroke="url(#neon-cyan)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Modern Hair Geometric Cut -->
  <path d="M 185 190 C 185 130, 220 110, 250 110 C 285 110, 315 130, 315 190 C 300 150, 270 140, 250 140 C 220 140, 195 160, 185 190 Z" fill="url(#neon-cyan)" opacity="0.9"/>

  <!-- Cyber Visor / Neural Eyes Glow -->
  <rect x="205" y="185" width="90" height="20" rx="10" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
  <line x1="210" y1="195" x2="290" y2="195" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Neural Constellation Overlay around head -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.75">
    <line x1="140" y1="130" x2="190" y2="160"/>
    <line x1="190" y1="160" x2="220" y2="110"/>
    <line x1="310" y1="120" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="330" y2="210"/>
    <circle cx="140" cy="130" r="4" fill="#00f0ff"/>
    <circle cx="190" cy="160" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="110" r="4" fill="#818cf8"/>
    <circle cx="310" cy="120" r="4" fill="#a855f7"/>
    <circle cx="350" cy="160" r="3" fill="#00f0ff"/>
    <circle cx="330" cy="210" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Bottom Tag Badge -->
  <rect x="130" y="440" width="240" height="34" rx="17" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5"/>
  <text x="250" y="462" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">BUDDAREDDY DIVIJ</text>
</svg>
